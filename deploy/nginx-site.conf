map $http_x_real_ip $tenant_client_key {
    default $http_x_real_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $tenant_client_key zone=tenantscope_reports:10m rate=12r/m;
limit_conn_zone $tenant_client_key zone=tenantscope_clients:10m;
limit_conn_zone $server_name zone=tenantscope_global:1m;
log_format tenantscope_min '$remote_addr - $time_local "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/html;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/ssl/certs/tenantscope-origin.crt;
    ssl_certificate_key /etc/ssl/private/tenantscope-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log /var/log/nginx/tenantscope_access.log tenantscope_min;
    error_log /var/log/nginx/tenantscope_error.log warn;

    allow 127.0.0.1;
    allow ::1;
    allow __REVERSE_PROXY_IP__;
    deny all;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; script-src 'self' 'sha256-3uD2HNHhfgKfWn9tw8dp06x/sM6qd7ZM4HK4NJxQNSU=' 'sha256-Z2vMD+4f290E8OH+HtbShRaOjpWjPn/ToHLh5ndNEUQ='; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-src https://login.microsoftonline.com; manifest-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    location ~ ^/api/reports/(m365-apps|copilot)$ {
        limit_except POST { deny all; }
        limit_req zone=tenantscope_reports burst=6 nodelay;
        limit_req_status 429;
        limit_conn tenantscope_clients 2;
        limit_conn tenantscope_global 2;
        limit_conn_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept "application/json";
        proxy_set_header Host "localhost";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 130s;
    }

    location /api/ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.map$ { return 404; }

    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|auth\.html|auth\.js|app\.js|analysis\.mjs|docx\.mjs|styles\.css|workspace\.css)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location ~ ^/assets/(brand|fonts|icons)/[a-zA-Z0-9._-]+$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location ~ ^/node_modules/@azure/(msal-browser/dist|msal-common/dist-browser)/[a-zA-Z0-9_./-]+\.mjs$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / { return 404; }
}
